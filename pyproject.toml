[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-transcription-service"
version = "0.1.0"
description = "Jellyfin sidecar subtitle generation service using asub."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "rich>=13",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "asub/src"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "asub/tests"]
pythonpath = ["src", "asub/src"]
addopts = "-q"
