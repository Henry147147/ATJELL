services:
  jellyfin:
    build:
      context: .
      dockerfile: docker/jellyfin.Dockerfile
    image: auto-transcription-jellyfin:local
    container_name: auto-transcription-jellyfin
    depends_on:
      asub-api:
        condition: service_healthy
    environment:
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_ROOT:-/mnt/media}:/media
    restart: unless-stopped

  asub-api:
    build:
      context: .
      dockerfile: docker/asub-api.Dockerfile
    image: auto-transcription-asub-api:local
    container_name: auto-transcription-asub-api
    environment:
      ASUB_API_TOKEN: ${ASUB_API_TOKEN:-}
      ASUB_TARGET_LANGS: ${ASUB_TARGET_LANGS:-en,es}
      ASUB_SUBTITLE_FORMATS: ${ASUB_SUBTITLE_FORMATS:-srt}
      ASUB_DEVICE: ${ASUB_DEVICE:-auto}
      ASUB_DTYPE: ${ASUB_DTYPE:-bf16}
      ASUB_ASR_MODEL: ${ASUB_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      ASUB_ALIGNMENT_MODEL: ${ASUB_ALIGNMENT_MODEL:-Qwen/Qwen3-ForcedAligner-0.6B}
      ASUB_TRANSLATION_SIZE: ${ASUB_TRANSLATION_SIZE:-medium}
      ASUB_TRANSLATION_MODEL: ${ASUB_TRANSLATION_MODEL:-tencent/Hy-MT2-7B-FP8}
      ASUB_GPU_MEMORY_UTILIZATION: ${ASUB_GPU_MEMORY_UTILIZATION:-0.72}
      ASUB_MAX_CONCURRENT_ASR: ${ASUB_MAX_CONCURRENT_ASR:-1}
      ASUB_MAX_CONCURRENT_ALIGNMENT: ${ASUB_MAX_CONCURRENT_ALIGNMENT:-1}
      ASUB_MAX_CONCURRENT_TRANSLATION: ${ASUB_MAX_CONCURRENT_TRANSLATION:-2}
      ASUB_UNLOAD_ON_IDLE: ${ASUB_UNLOAD_ON_IDLE:-true}
      ASUB_WORK_DIR: ${ASUB_WORK_DIR:-/work}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
      VLLM_ATTENTION_BACKEND: ${VLLM_ATTENTION_BACKEND:-FLASHINFER}
      VLLM_USE_V1: ${VLLM_USE_V1:-1}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      HF_HOME: /models/huggingface
    ports:
      - "${ASUB_API_PORT:-8765}:8765"
    volumes:
      - ${MEDIA_ROOT:-/mnt/media}:/media
      - asub-models:/models
      - asub-work:/work
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  asub-api-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: docker/asub-api.Dockerfile
    image: auto-transcription-asub-api:local
    container_name: auto-transcription-asub-api-cpu
    environment:
      ASUB_DEVICE: cpu
      ASUB_TARGET_LANGS: ${ASUB_TARGET_LANGS:-en,es}
      ASUB_SUBTITLE_FORMATS: ${ASUB_SUBTITLE_FORMATS:-srt}
      ASUB_ASR_MODEL: ${ASUB_ASR_MODEL:-Qwen/Qwen3-ASR-0.6B}
      ASUB_TRANSLATION_SIZE: ${ASUB_TRANSLATION_SIZE:-small}
      ASUB_MAX_CONCURRENT_ASR: 1
      ASUB_MAX_CONCURRENT_ALIGNMENT: 1
      ASUB_MAX_CONCURRENT_TRANSLATION: 1
      ASUB_UNLOAD_ON_IDLE: ${ASUB_UNLOAD_ON_IDLE:-true}
      ASUB_WORK_DIR: /work
      HF_HOME: /models/huggingface
    ports:
      - "${ASUB_API_PORT:-8765}:8765"
    volumes:
      - ${MEDIA_ROOT:-/mnt/media}:/media
      - asub-models:/models
      - asub-work:/work
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  asub-models:
  asub-work:
